                WHEN 'NOx' THEN 'NOx'
                WHEN 'O3' THEN 'O3'
                WHEN 'SO2' THEN 'SO2'
                WHEN 'CO' THEN 'CO'
                WHEN 'Velocidad del viento' THEN 'WindSpeed'
