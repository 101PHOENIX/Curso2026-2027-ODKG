        )

  city:
    referenceFormulation: csv
    query: SELECT 'Valencia' AS city_id, 'Valencia' AS city_name

mappings:

  observation:
    sources: observations
    subjects: obs:$(station_id)_$(time_id)_$(property_id)
    predicateobjects:
      - [a, aq:Observation]
      - [rdfs:label, "$(property_label) at $(station_name), $(result_time)", xsd:string]
      - [aq:hasStation, station:$(station_id)~iri]
      - [aq:observedProperty, prop:$(property_id)~iri]
      - [aq:resultTime, $(result_time), xsd:dateTime]
      - [aq:resultValue, $(result_value), xsd:decimal]

  monitoringStation:
    sources: stations
    subjects: station:$(station_id)
    predicateobjects:
      - [a, aq:MonitoringStation]
      - [rdfs:label, $(station_name), xsd:string]
      - [aq:stationName, $(station_name), xsd:string]
      - [aq:locatedInCity, city:Valencia~iri]

  observableProperty:
    sources: properties
    subjects: prop:$(property_id)
    predicateobjects:
      - [a, aq:ObservableProperty]
      - [rdfs:label, $(property_label), xsd:string]

  city:
    sources: city
    subjects: city:$(city_id)
    predicateobjects:
      - [a, aq:City]
      - [rdfs:label, $(city_name), xsd:string]
