
prefixes:
  rr: http://www.w3.org/ns/r2rml#
  rml: http://semweb.mmlab.be/ns/rml#
  ql: http://semweb.mmlab.be/ns/ql#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#
  ao: http://group01.opendata.upm.es/ontology/accidents#

mappings:
  AccidentMap:
    sources:
      - [csv/US_Accidents_New_York-updated.csv~csv]

    s: http://group01.opendata.upm.es/resource/accidents/$(ID)

    po:
      - [a, ao:TrafficAccident]
      - [ao:severity, $(Severity), xsd:integer]
      - [ao:startTime, $(Start_Time), xsd:dateTime]
      - [ao:endTime, $(End_Time), xsd:dateTime]
      - [ao:latitude, $(Start_Lat), xsd:decimal]
      - [ao:longitude, $(Start_Lng), xsd:decimal]
      - [ao:description, $(Description), xsd:string]
      - [ao:hasTrafficSignal, $(Traffic_Signal), xsd:boolean]

      - p: ao:locatedOn
        o:
          mapping: StreetMap
          condition:
            function: equal
            parameters:
              - [str1, $(Street_Slug)]
              - [str2, $(Street_Slug)]

  StreetMap:
    sources:
      - [csv/US_Accidents_New_York-updated.csv~csv]

    s: http://group01.opendata.upm.es/resource/streets/$(Street_Slug)

    po:
      - [a, ao:Street]
      - [ao:streetName, $(Street), xsd:string]
