<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172536; }
    .title { font-size: 28px; font-weight: 700; fill: #ffffff; }
    .subtitle { font-size: 14px; fill: #d9e6f0; }
    .section { font-size: 18px; font-weight: 700; }
    .small { font-size: 13px; fill: #5a6d7c; }
    .label { font-size: 14px; font-weight: 600; }
    .axis { font-size: 13px; fill: #354b5d; }
  </style>

  <!-- Background -->
  <rect width="1200" height="760" fill="#f4f7fa"/>

  <!-- Header -->
  <rect x="30" y="30" width="1140" height="90" rx="16" fill="#16324f"/>
  <text x="60" y="70" class="title">Compare Monitoring Stations</text>
  <text x="60" y="98" class="subtitle">Explore the association between nearby terraces and nighttime acoustic readings</text>

  <!-- Controls -->
  <rect x="30" y="145" width="1140" height="75" rx="12" fill="#ffffff" stroke="#d9e1e9"/>

  <rect x="55" y="164" width="220" height="38" rx="8" fill="#ffffff" stroke="#aabac8"/>
  <text x="72" y="188" class="label">Noise: 1 Jan–30 Jun 2025 ▾</text>

  <rect x="295" y="164" width="200" height="38" rx="8" fill="#ffffff" stroke="#aabac8"/>
  <text x="312" y="188" class="label">Radius: 250 m ▾</text>

  <rect x="515" y="164" width="270" height="38" rx="8" fill="#ffffff" stroke="#aabac8"/>
  <text x="532" y="188" class="label">No-data stations excluded</text>

  <text x="930" y="188" class="small">Sources &amp; interpretation guide</text>

  <!-- Main chart panel -->
  <rect x="30" y="245" width="1140" height="430" rx="12" fill="#ffffff" stroke="#cfdae3"/>
  <text x="55" y="282" class="section">Terrace proximity and nighttime readings</text>
  <text x="55" y="307" class="small">One point per station · Correlation: from data · Stations used: from data · Excluded: from data</text>

  <!-- Plot background -->
  <rect x="110" y="335" width="980" height="270" rx="8" fill="#ffffff" stroke="#d7e1e8"/>

  <!-- Grid -->
  <line x1="110" y1="390" x2="1090" y2="390" stroke="#d7e1e8"/>
  <line x1="110" y1="460" x2="1090" y2="460" stroke="#d7e1e8"/>
  <line x1="110" y1="530" x2="1090" y2="530" stroke="#d7e1e8"/>

  <line x1="275" y1="335" x2="275" y2="605" stroke="#eef2f5"/>
  <line x1="440" y1="335" x2="440" y2="605" stroke="#eef2f5"/>
  <line x1="605" y1="335" x2="605" y2="605" stroke="#eef2f5"/>
  <line x1="770" y1="335" x2="770" y2="605" stroke="#eef2f5"/>
  <line x1="935" y1="335" x2="935" y2="605" stroke="#eef2f5"/>

  <!-- Axes -->
  <line x1="110" y1="605" x2="1090" y2="605" stroke="#9aafbf" stroke-width="1.5"/>
  <line x1="110" y1="335" x2="110" y2="605" stroke="#9aafbf" stroke-width="1.5"/>

  <!-- Station points -->
  <g fill="#125b91" stroke="#ffffff" stroke-width="2">
    <circle cx="190" cy="535" r="9"/>
    <circle cx="285" cy="455" r="9"/>
    <circle cx="360" cy="548" r="9"/>
    <circle cx="445" cy="478" r="9"/>
    <circle cx="530" cy="505" r="9"/>
    <circle cx="615" cy="420" r="9"/>
    <circle cx="700" cy="485" r="9"/>
    <circle cx="800" cy="395" r="9"/>
    <circle cx="900" cy="455" r="9"/>
    <circle cx="1015" cy="370" r="9"/>
  </g>

  <!-- Selected point label -->
  <line x1="800" y1="395" x2="850" y2="365" stroke="#183e5d" stroke-width="1.5"/>
  <rect x="850" y="345" width="185" height="48" rx="7" fill="#ffffff" stroke="#9aafbf"/>
  <text x="865" y="365" class="label">Selected station</text>
  <text x="865" y="383" class="small">Nights: from data</text>

  <!-- Axis labels -->
  <text x="600" y="645" class="axis" text-anchor="middle">Registered terraces within 250 m · Snapshot: 4 Oct 2026</text>
  <text x="36" y="325" class="axis">Average nightly LAeq (N), dB(A)</text>

  <!-- Note -->
  <rect x="30" y="695" width="1140" height="40" rx="10" fill="#edf5fb"/>
  <text x="50" y="720" class="small">
    Illustrative wireframe. Points and values are placeholders; an association does not imply causation.
  </text>
</svg>
