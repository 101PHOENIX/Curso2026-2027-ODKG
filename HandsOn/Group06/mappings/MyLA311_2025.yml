prefixes:
  rr: http://www.w3.org/ns/r2rml#
  xsd: http://www.w3.org/2001/XMLSchema#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  rml: http://semweb.mmlab.be/ns/rml#
  ql: http://semweb.mmlab.be/ns/ql#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  geo: http://www.opengis.net/ont/geosparql#
  la311: http://www.owl-ontologies.com/la311#
  res: http://linkeddata.la311.com/resource/

mappings:
  ServiceRequest:
    sources:
      - [csv/MyLA311_2025.csv~csv]
    s: res:ServiceRequest/$(SRNumber)
    po:
      - [a, la311:ServiceRequest]
      - [la311:srNumber, $(SRNumber), xsd:string]
      - [la311:createdDate, $(CreatedDate), xsd:dateTime]
      - [la311:updatedDate, $(UpdatedDate), xsd:dateTime]
      - [la311:serviceDate, $(ServiceDate), xsd:dateTime]
      - [la311:closedDate, $(ClosedDate), xsd:dateTime]
      - [la311:actionTaken, $(ActionTaken), xsd:string]
      - [la311:requestType, $(RequestType), xsd:string]
      - [la311:status, $(Status), xsd:string]
      - p: la311:responsible
        o:
          mapping: Organization
      - p: la311:assignedTo
        o:
          mapping: Service
      - p: la311:reportedBy
        o:
          mapping: Agent
      - p: la311:hasLocation
        o:
          mapping: Location

  Organization:
    sources:
      - [csv/MyLA311_2025.csv~csv]
    s: res:Organization/$(Owner)
    po:
      - [a, la311:Organization]
      - [la311:name, $(Owner), xsd:string]

  Service:
    sources:
      - [csv/MyLA311_2025.csv~csv]
    s: res:Service/$(AssignTo)
    po:
      - [a, la311:Service]
      - [la311:name, $(AssignTo), xsd:string]

  Agent:
    sources:
      - [csv/MyLA311_2025.csv~csv]
    s: res:Agent/Reporter_$(SRNumber)
    po:
      - [a, la311:Agent]
      - [rdfs:label, $(CreatedByUserOrganization), xsd:string]

  Location:
    sources:
      - [csv/MyLA311_2025.csv~csv]
    s: res:Location/$(HouseNumber)_$(Direction)_$(StreetName)_$(Suffix)_$(ZipCode)
    po:
      - [a, la311:Location]
      - [la311:address, "$(HouseNumber) $(Direction) $(StreetName) $(Suffix), $(ZipCode)", xsd:string]
      - [geo:asWKT, $(Location), geo:wktLiteral]
